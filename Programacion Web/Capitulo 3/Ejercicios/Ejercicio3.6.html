    <h1>Ejercicio 3.6</h1>

    <form>
      <p>
        <label>Primer nombre:</label>
        <input type="text" name="nombre" />
      </p>

      <p>
        <label>Apellido:</label>
        <input type="text" name="apellido" />
      </p>

      <p>
        <label>Correo electrónico:</label>
        <input type="email" name="correo" />
      </p>

      <details>
        <summary>Encuesta opcional</summary>

        <p>¿En qué año de la universidad se encuentra?</p>

        <input type="radio" name="año" value="primero" /> Primer año
        <br />
        <input type="radio" name="año" value="segundo" /> Segundo año
        <br />
        <input type="radio" name="año" value="tercero" /> Tercer año
        <br />
        <input type="radio" name="año" value="cuarto" /> Cuarto año
        <br />
        <input type="radio" name="año" value="quinto" /> Quinto año
      </details>

      <p>
        <input type="submit" value="Registrarse" />
      </p>
    </form>
