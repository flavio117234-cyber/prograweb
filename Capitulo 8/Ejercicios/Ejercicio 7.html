<!DOCTYPE html>

<!-- Ejercicio 8.7: Producto de impares del 1 al 15 -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 8.7 - Producto de impares</title>
      <script>
         var producto = 1;

         for ( var i = 1; i <= 15; i += 2 ) {
            producto *= i;
         }

         document.writeln( "<p>El producto de los enteros impares del 1 al 15 es: " + producto + "</p>" );
      </script>
   </head>
