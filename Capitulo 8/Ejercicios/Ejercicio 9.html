<body>

<h1>Histograma</h1>

<button onclick="ejercicio89()">Generar histograma</button>
<div id="resultado"></div>

<script>
function ejercicio89() {
    let resultado = "";
    let cantidad = 20;

    for (let i = 1; i <= cantidad; i++) {
        let numero = Math.floor(Math.random() * 30) + 1;

        resultado += numero + ": ";

        for (let j = 1; j <= numero; j++) {
            resultado += "*";
        }

        resultado += "<br>";
    }

    document.getElementById("resultado").innerHTML = resultado;
}
</script>
