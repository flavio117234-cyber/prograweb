<body>

<h1>Los doce días de Navidad</h1>

<button onclick="ejercicio810()">Mostrar los regalos</button>
<div id="resultado"></div>

<script>
function ejercicio810() {
    let regalos = [
        "Una perdiz en un peral",
        "Dos tórtolas",
        "Tres gallinas francesas",
        "Cuatro pájaros cantores",
        "Cinco anillos de oro",
        "Seis gansos poniendo huevos",
        "Siete cisnes nadando",
        "Ocho criadas ordeñando",
        "Nueve bailarinas",
        "Diez señores saltando",
        "Once gaiteros tocando",
        "Doce tamborileros"
    ];

    let resultado = "";

    for (let dia = 1; dia <= 12; dia++) {
        resultado += "<h2>Día " + dia + "</h2>";

        for (let i = dia - 1; i >= 0; i--) {
            resultado += regalos[i] + "<br>";
        }
    }

    document.getElementById("resultado").innerHTML = resultado;
}
</script>
