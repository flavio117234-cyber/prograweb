<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6.19</title>
</head>
<body>
    <script>
        let radio = parseFloat(prompt("Ingrese el radio del círculo:"));

        let diametro = 2 * radio;
        let circunferencia = 2 * Math.PI * radio;
        let area = Math.PI * (radio * radio);

        document.write("<h1>Ejercicio 6.19</h1>");
        document.write("<p>Diámetro: " + diametro + "</p>");
        document.write("<p>Circunferencia: " + circunferencia + "</p>");
        document.write("<p>Área: " + area + "</p>");
    </script>

</body>
