<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6.18</title>
</head>
<body>
    <script>
        var n1 = parseInt(prompt("Ingrese el primer entero:"));
        var n2 = parseInt(prompt("Ingrese el segundo entero:"));
        var n3 = parseInt(prompt("Ingrese el tercer entero:"));

        var suma = n1 + n2 + n3;
        var promedio = suma / 3;
        var producto = n1 * n2 * n3;
        var menor = Math.min(n1, n2, n3);
        var mayor = Math.max(n1, n2, n3);

        alert("Suma: " + suma + "\nPromedio: " + promedio + "\nProducto: " + producto + "\nMenor: " + menor + "\nMayor: " + mayor);
    </script>
