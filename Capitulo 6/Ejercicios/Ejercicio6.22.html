<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6.22</title>
</head>
<body>
    <script>
        let num1 = parseInt(prompt("Ingrese el primer entero:"));
        let num2 = parseInt(prompt("Ingrese el segundo entero:"));

        if (num1 % num2 === 0) {
            document.write("<p>" + num1 + " es múltiplo de " + num2 + ".</p>");
        } else {
            document.write("<p>" + num1 + " NO es múltiplo de " + num2 + ".</p>");
        }
    </script>
