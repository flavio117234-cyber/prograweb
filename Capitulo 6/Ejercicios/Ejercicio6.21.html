    <title>Ejercicio 6.21</title>
</head>
<body>
    <script>
        let numero = parseInt(prompt("Ingrese un número entero:"));

        if (numero % 2 === 0) {
            document.write("<p>El número " + numero + " es PAR.</p>");
        } else {
            document.write("<p>El número " + numero + " es IMPAR.</p>");
        }
    </script>
