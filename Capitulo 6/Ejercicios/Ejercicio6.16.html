<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6.16</title>
</head>
<body>
    <h1>Ejercicio 6.16</h1>
    <script>
        var num1 = parseFloat(prompt("Ingrese el primer número:"));
        var num2 = parseFloat(prompt("Ingrese el segundo número:"));

        var suma = num1 + num2;
        var producto = num1 * num2;
        var diferencia = num1 - num2;
        var cociente = num1 / num2;

        document.write("<p>Suma: " + suma + "</p>");
        document.write("<p>Producto: " + producto + "</p>");
        document.write("<p>Diferencia: " + diferencia + "</p>");
        document.write("<p>Cociente: " + cociente + "</p>");
    </script>

</body>
</html>
