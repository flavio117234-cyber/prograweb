<!DOCTYPE html>

    <title>Ejercicio 7.15</title>
</head>
<body>

<h1>Número mayor</h1>

<script>
var contador = 1;
var numero;
var mayor = -1;

while (contador <= 10) {
    numero = parseInt(
        window.prompt("Escriba el número " + contador + " (0 a 9):")
    );

    if (numero > mayor) {
        mayor = numero;
    }

    contador++;
}

document.writeln("<p>El número mayor es: " + mayor + "</p>");

</script>
