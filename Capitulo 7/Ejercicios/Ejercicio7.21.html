<body>
    <h1>Múltiplos de 2 (Ciclo Infinito)</h1>
    <p><strong>Nota:</strong> Este programa imprime progresivamente las potencias de 2 (2, 4, 8, 16, 32, 64...)[cite: 3]. En la consola/página se sobrecargará o terminará mostrando <code>Infinity</code> cuando supere el límite numérico de JavaScript[cite: 3].</p>
    <script>
        let multiplo = 2;

        while (true) {
            document.write(multiplo + "<br>");
            multiplo = multiplo * 2;
        }
    </script>
