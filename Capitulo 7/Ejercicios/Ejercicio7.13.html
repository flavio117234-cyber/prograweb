<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 7.13</title>
</head>
<body>

<h1>Salario del vendedor</h1>

<script>
var articulo;
var ventas = 0;
var salario;

for (var i = 1; i <= 4; i++) {
    articulo = parseFloat(
        window.prompt("Escriba el valor del artículo " + i + ":")
    );

    ventas += articulo;
}

salario = 200 + ventas * 0.09;

document.writeln("<p>Total de ventas: $" + ventas.toFixed(2) + "</p>");
document.writeln("<p>Salario semanal: $" + salario.toFixed(2) + "</p>");

</script>
