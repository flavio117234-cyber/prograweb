<h1>Ejercicio 7.10</h1>

<script>
var y;
var x = 1;
var total = 0;

while (x <= 10) {
    y = x * x;
    document.writeln("<p>" + y + "</p>");
    total += y;
    ++x;
}

document.writeln("<p>El total es " + total + "</p>");
</script>
