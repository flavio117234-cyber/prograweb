<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>Ejercicio 5.10</title>
    <style type="text/css">
      .skew .textbox {
        margin-left: 75px;
        background: lightgreen;
        height: 100px;
        width: 200px;
        padding: 25px 0;
        text-align: center;
        font-size: 250%;
        border: 3px solid darkgreen;
        border-radius: 15px;
        -webkit-animation: skew 2s infinite linear;
        -moz-animation: skew 3s infinite linear;
        animation: skew 3s infinite linear;
      }
      @-webkit-keyframes skew {
        from {
          -webkit-transform: skewY(0deg);
        }

        25% {
          -webkit-transform: skewY(30deg);
        }

        50% {
          -webkit-transform: skewY(0deg);
        }

        75% {
          -webkit-transform: skewX(30deg);
        }

        to {
          -webkit-transform: skewX(0deg);
        }
      }

      @-moz-keyframes skew {
        from {
          -moz-transform: skewY(0deg);
        }

        25% {
          -moz-transform: skewY(30deg);
        }

        50% {
          -moz-transform: skewY(0deg);
        }

        75% {
          -moz-transform: skewX(30deg);
        }

        to {
          -moz-transform: skewX(0deg);
        }
      }

      @keyframes skew {
        from {
          transform: skewY(0deg);
        }

        25% {
          transform: skewY(30deg);
        }

        50% {
          transform: skewY(0deg);
        }

        75% {
          transform: skewX(30deg);
        }

        to {
          transform: skewX(0deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="box skew">
      <div class="textbox">Inclinar texto</div>
    </div>

    <br>
    <br>
    <br>
    <br />

        </td>

        <td align="right">
          <a href="../../index.html">Volver a Capítulos</a>
        </td>
      </tr>
    </table>
  </body>
</html>
