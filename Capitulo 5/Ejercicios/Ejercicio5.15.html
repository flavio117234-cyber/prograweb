<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Reflejo de una imagen</title>
    <style type="text/css">
      .contenedor {
        position: relative;
        width: 200px;
      }
      .imagen {
        width: 200px;
      }
      .reflejo {
        width: 200px;
        position: absolute;
        left: 220px;
        top: 0;
        transform: scaleX(-1);
      }
    </style>
  </head>
  <body>
    <h1>Reflejo de una imagen</h1>
    <div class="contenedor">
      <img class="imagen" src="Imagenes/imagen4.jpg" alt="Imagen original" />
      <img class="reflejo" src="Imagenes/imagen4.jpg" alt="Reflejo" />
    </div>
