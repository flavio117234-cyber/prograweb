<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>Ejercicio5.11</title>

    <style type="text/css">
      #portada {
        position: relative;
        margin: 0 auto;
        width: 128px;
        height: 169px;
      }

      #portada img {
        position: absolute;
        left: 0;
        top: 0;
        transition-property: opacity;
        transition-duration: 5s;
        transition-timing-function: linear;
      }

      #portada img:nth-child(1) {
        z-index: 5;
      }

      #portada img:nth-child(2) {
        z-index: 4;
      }

      #portada img:nth-child(3) {
        z-index: 3;
      }

      #portada img:nth-child(4) {
        z-index: 2;
      }

      #portada img:nth-child(5) {
        z-index: 1;
      }

      #portada:hover img:nth-child(1) {
        opacity: 0;
      }

      #portada:hover img:nth-child(2) {
        opacity: 0;
      }

      #portada:hover img:nth-child(3) {
        opacity: 0;
      }

      #portada:hover img:nth-child(4) {
        opacity: 0;
      }
    </style>
  </head>

  <body>
    <div id="portada">
      <img src="Imagenes/imagen1.jpg" width="128" height="169" alt="Imagen 1" />

      <img src="Imagenes/imagen2.jpg" width="128" height="169" alt="Imagen 2" />

      <img src="Imagenes/imagen3.jpg" width="128" height="169" alt="Imagen 3" />

      <img src="Imagenes/imagen4.jpg" width="128" height="169" alt="Imagen 4" />

      <img src="Imagenes/imagen5.jpg" width="128" height="169" alt="Imagen 5" />
    </div>

  </body>
</html>
